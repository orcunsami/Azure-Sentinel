id: b2c3d4e5-f6a7-4b8c-9d0e-1f2a3b4c5d6e
name: SOCRadar Feeds - Collection Statistics
description: Daily import statistics per feed collection. Monitors feed health and volume trends.
requiredDataConnectors:
  - connectorId: CustomLogsAma
    dataTypes:
      - SOCRadar_Feeds_CL
tactics:
  - Collection
relevantTechniques:
  - T1119
query: |
  SOCRadar_Feeds_CL
  | where TimeGenerated > ago(30d)
  | summarize DailyCount=dcount(IndicatorValue) by CollectionName, bin(TimeGenerated, 1d)
  | order by TimeGenerated desc, DailyCount desc
